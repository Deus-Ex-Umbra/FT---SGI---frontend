<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Background rounded square -->
  <rect width="36" height="36" rx="9" fill="currentColor" fill-opacity="0.12"/>
  <!-- Clipboard body -->
  <rect x="9" y="11" width="18" height="20" rx="2.5" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6"/>
  <!-- Clipboard top notch -->
  <rect x="14" y="8.5" width="8" height="4" rx="2" fill="currentColor" stroke="currentColor" stroke-width="1.4"/>
  <!-- Checkmark lines -->
  <polyline points="13.5,20 16.5,23 22.5,16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom line accent -->
  <line x1="13.5" y1="26" x2="22.5" y2="26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
